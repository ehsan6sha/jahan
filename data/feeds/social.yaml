# Social-media sources read by `jahan ingest` (ingest/social.py).  Real posts become news inside the world;
# what virtual people post stays inside the world.  Accounts were checked on 2026-10-14 (follower counts
# from each platform's public profile API); they change, so this file is not hashed into world snapshots.
#
# Platforms:
#   x         unofficial: a third-party reader of public X posts (unifapi.com).  Free tier: 20 units per
#             10 minutes, 2 per search.  X has taken scrapers to court and several readers have shut down,
#             so it may stop working; switch it off with `--no-x` or `enabled: false`.
#   bluesky   official public API, no login.
#   mastodon  official public API of each server, no login.
#   telegram  public channel previews at t.me/s/<channel>, no login.
# Facebook, TikTok, WhatsApp, Instagram and WeChat have no free way to read them; they are not used.

sources:
  x:
    enabled: true
    kind: unofficial
    search_url: "https://unifapi.com/tools/x/search?q="
    max_searches: 10
    note: "Unofficial reader of public X posts; may stop working (X has sued scrapers). Turn off with --no-x."
  bluesky:
    enabled: true
    kind: official
    author_feed_url: "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed"
    search_url: "https://api.bsky.app/xrpc/app.bsky.feed.searchPosts"   # the public.api host refuses search
  mastodon:
    enabled: true
    kind: official
  telegram:
    enabled: true
    kind: public_preview
    preview_url: "https://t.me/s/"

lookback_days: 2   # posts since (fetch day - 2); derived from the fetch day, never the clock

# How strongly a post is pushed to a country's social channel: the platform's users as a share of the
# country's internet users.  DataReportal "Digital 2026: <country>" (Kepios): internet users in October 2025,
# platform advertising reach in late 2025, in millions.  Advertising reach is not the same as monthly users.
platform_usage:
  default_share: {x: 0.3, bluesky: 0.05, mastodon: 0.05, telegram: 0.3}   # HEURISTIC where no figure is published
  countries:
    USA: {source: datareportal.USA, internet_users_m: 324, platforms_m: {x: 99.0}}
    BRA: {source: datareportal.BRA, internet_users_m: 185, platforms_m: {x: 17.1}}
    DEU: {source: datareportal.DEU, internet_users_m: 78.5, platforms_m: {x: 19.0}}
    NGA: {source: datareportal.NGA, internet_users_m: 109, platforms_m: {x: 6.95}}
    IND: {source: datareportal.IND, internet_users_m: 1030, platforms_m: {x: 22.2}}
    IDN: {source: datareportal.IDN, internet_users_m: 230, platforms_m: {x: 22.9}}
    IRN: {source: datareportal.IRN, internet_users_m: 73.8, platforms_m: {x: null, telegram: null}}   # no per-platform figures

countries:
