# Backtest events, 2023-2025: every Fed decision and every jobs report (`jahan backtest`).
#
# Same conventions as events_2026.yaml. Inputs hold only what was known before each release: the decision or
# the jobs number, and what markets expected the day before (CME FedWatch probabilities as reported in the news,
# or the Dow Jones consensus for jobs). `actual` holds the release day's close-to-close moves, in percent:
#   us_stocks  S&P 500 close (FRED series SP500)
#   gold       exchange-rates.org yearly gold price pages (the page does not state its pricing time; on some days
#              it differs from spot after the New York close)
#   dollar     ICE US dollar index (DXY), Yahoo Finance DX-Y.NYB daily closes. Three days where Yahoo repeats the
#              previous close are left out (null).
# two_year_bp: the day's change in the 2-year Treasury yield (FRED DGS2), used only in the after-the-fact column.
# A null actual means the market was closed or no reliable value was found. Only daily percent changes are kept,
# each with its page; check the vendors' terms before reusing them. Retrieved 2026-10-14 by web research;
# scripts/check_market_actuals.py re-checks the FRED values.
retrieved: '2026-10-14'
noise_sd:
  us_stocks: 0.92
  gold: 1.28
  dollar: 0.41
  note: Standard deviation of daily percent changes, 2023 to October 2026, computed for this benchmark from FRED
    SP500, Yahoo Finance GC=F (front-month gold futures; contract rolls may inflate it) and DX-Y.NYB. Approximate;
    a guide to what counts as an ordinary day, not a published figure.
events:
