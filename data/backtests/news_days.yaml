# B9: US stock market on unscheduled news days (data/backtests/benchmarks.yaml, check B9).
#
# Collected on 2026-11-08 under the selection rule registered in commit 4886978 before any collection: for each
# month the first two qualifying events in Wikipedia's "<year> in the United States" (revisions below), chosen
# by the news, never by the market. Three research helpers read the pages through the MediaWiki API, found one
# contemporaneous report per event to time it, and wrote one neutral headline per event (never about markets).
# How they read the clauses, and every judgment call with the alternative pick, are in each event's note;
# notable readings: "elections" means an election held or its result (not campaign news); troop deployments in
# a war count as war actions; an event first reported after 16:00 New York time goes to the next trading day.
# Outcome-chosen days (picked because markets moved) are scored but never used to choose anything.
# The `actual` moves are FRED SP500 percent changes (release day and the next 4 FRED dates), added by
# scripts/news_days_moves.py; the tech line's moves (FRED NASDAQ100, "Copyrighted: Pre-Approval Required") are
# never stored here (runs/_benchmark/news_days_tech.yaml, git-ignored). Check S&P Dow Jones Indices' terms before
# reusing the percent moves.

