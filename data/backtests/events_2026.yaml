# Backtest events: real 2026 announcements and what markets did (`jahan backtest`).
#
# Inputs hold only what was known before each release: the decision or the jobs number, and what markets
# expected the day before. `actual` holds the release day's close-to-close moves, in percent:
#   us_stocks  S&P 500 close (FRED series SP500)
#   gold       spot gold, priced after the New York close (Investing.com XAU/USD; exchange-rates.org where
#              noted). COMEX futures settle at 13:30 New York time, before a 14:00 Fed release, so they would
#              show the reaction a day late.
#   dollar     ICE US dollar index (DXY; Yahoo Finance DX-Y.NYB). Jahan moves only the euro rate; the euro is
#              the largest part of the index.
# two_year_bp: the day's change in the 2-year Treasury yield (FRED DGS2), used only in the after-the-fact
# column, never in a forecast.
# Gold and dollar moves come from data vendors' pages (no free official series); S&P and yields from FRED.
# Only daily percent changes are kept here, each with the page it came from; check the vendors' terms
# before reusing them.
# Retrieved 2026-10-14. Gathered from the pages listed under each event; see scripts/check_market_actuals.py
# for the FRED part.

retrieved: 2026-10-14

noise_sd:
  us_stocks: 0.92
  gold: 1.28
  dollar: 0.41
  note: >-
    Standard deviation of daily percent changes, 2023 to October 2026, computed for this benchmark from FRED
    SP500, Yahoo Finance GC=F (front-month gold futures; contract rolls may inflate it) and DX-Y.NYB.
    Approximate; a guide to what counts as an ordinary day, not a published figure.

