  - event: fomc-2026-09-16
    days_after: 2
    low: 0.10
    high: 0.41
    source: markets.lamla_vinogradov2019
    note: >-
      In surveys around 12 Fed press conferences (2015-2018), about 30% of US consumers had heard some news
      about the Fed in the week before and about 40% in the first two days after; the announcement itself
      added about 10 points. The share who heard this decision should lie between the added 10 points and
      the 41% total. Jahan tracks only this headline, with no earlier Fed news.
