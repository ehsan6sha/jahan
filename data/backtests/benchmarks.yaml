# Benchmarks of everyday activity against real data (`jahan benchmark`), PRE-REGISTERED.
#
# Written and committed on 2026-10-17, before any benchmark or everyday-activity backtest was run. The checks,
# pass limits, the numbers that may be tuned, their search grids and the fit/hold-out split below must not be
# changed after seeing results; a change means a new version of this file with the reason, and the old results
# stay published next to the new ones.
#
# The rule for kappa (the one fitted number of people's trading) is in data/global/investors.yaml
# (trading.kappa.rule_v3, after rule_v2); B1 and B2 are its score and its bounds. Version 3 adds B9 and B10 and
# the rule for s, the one fitted number of other investors' news reactions (other_investors.rule_v4 in the same
# file), registered on 2026-11-08 before any B9 data was collected or any run of that mechanism.

version: 4
registered: '2026-11-08'
history:
  - version: 3
    registered: '2026-11-08'
    result: >-
      B9: s = 1.43 on the 64 fit days (0.796 against 0.834 with s = 0 and 0.838 for no change; the 95% interval of s
      is 0 to 4.78); 11 seen days 0.515 against 0.476 (no change 0.451); 8 hold-out days 1.050 against 0.754 (no
      change 0.800). B10 passed.
    changes_in_version_4: >-
      Prompted by the diagnosis of those results on 2026-11-08, on saved data: (1) with the right direction forced
      the fit improves from 0.795 to 0.621 and s rises to 3.94, so direction is the main loss; (2) direction agrees
      with the real move on 30 of 50 rated fit days; (3) five days carry the fit (without them s = 0); (4) later
      ratings lean negative (8 of 9 on the hold-out days, while the market rose on 5 of 8); (5) reaction shape,
      volatility scaling and the model's memory of past days were tested and do not explain it. The hold-out days
      were looked at day by day for this diagnosis, so version 4 also collects days nobody has looked at. New
      check B11. B1 to B10 are unchanged.
  - version: 1
    registered: '2026-10-17'
    result: >-
      B1 kappa 0 (every positive kappa worse over five days); B2 nothing to bound; B3 passed; B4 ownership passed,
      logins failed (mean 97.3 days against 85.2: the interpolated spread's own mean is 90.4, the rest sampling of
      512 simulated US holders); B5 passed (time passing beat a flat price: 8.28 against 10.66 points on 79 fit
      questions; 12.06 against 15.69 on 206 hold-out questions); B6 flagged, but its registered unit (standard
      deviations of daily mood changes) is near zero in a world without news, so the ratio was meaningless.
    changes_in_version_2: >-
      (1) The mechanism priced by B1 and B2 is rule_v3 (news priced when it arrives; late trades do not move
      prices), registered before it was run, for the reason given in investors.yaml. (2) B6's units: both slopes
      are now expressed as a share of the series' observed range (real: the University of Michigan index's
      1978-2025 range; simulated: the mood scale's width of 2), still reported only. Everything else unchanged.
  - version: 2
    registered: '2026-10-17'
    result: >-
      B1 kappa 0.048 under rule_v3 (2023-2025 five-day 0.828 with people, 0.841 without; the 95% interval of the
      difference includes zero; the 8 seen 2026 events worse, 0.886 against 0.869); B2 passed (the Iran example's
      worst day -0.54% against the real -1.74%); B3 passed; B4 ownership passed, logins failed; B5 passed; B6
      flagged (layoffs alone barely move the national mood).
    changes_in_version_3: >-
      Prompted by a replay of 3-6 November 2026 (the midterm week: real S&P 500 +1.58%, -4.36%, +0.3%; Jahan 0.00%,
      -0.15%, +0.01 to +0.16%). Diagnosis: the market heard news only through the few simulated households who
      heard a story on its first day; the parser's ratings were not defined for markets; split headlines added
      up; kappa was fitted on hand-set ratings. (1) New B9: unscheduled news days, scored for the other-investors
      part (other_investors.rule_v4) and the people's part together. (2) New B10: ordinary-day movement
      (other_investors.quiet_days), reported. (3) B1 is also re-scored with the announcement headlines rated by
      the What-if parser instead of hand-set (reported; kappa is not refitted). Everything else unchanged.

split:
  stocks:
    fit: forecast events dated 2023-01-01 to 2025-12-31 (data/backtests/events_2023_2025.yaml)
    seen: >-
      forecast events dated 2026-01-01 to 2026-10-16 (data/backtests/events_2026.yaml): seen before this
      registration, reported as exploratory, never used to choose anything
    holdout: >-
      forecast events dated 2026-10-17 or later, scored once at least 12 exist; until then results are
      fit-period only, and the README says so
  odds:
    fit: questions whose market closed before 2026-07-01
    holdout: questions whose market closed on 2026-07-01 or later (or is still open at the run)
  news:
    fit: B9 news-chosen days 2023-01-01 to 2025-12-31
    seen: >-
      B9 news-chosen days 2026-01-01 to 2026-06-30, and every outcome-chosen day: reported, never used to choose
      anything. The parser model (claude-sonnet-5-5, training data to June 2026 per Anthropic's models page) saw
      what happened on all days before July 2026, so fit and seen results are optimistic
    holdout: >-
      B9 news-chosen days from 2026-07-01 on (after the parser model's training data): never used to choose
      anything; results are provisional until 20 such days are scored, then the verdict is published whatever it
      shows

checks:
  B1:
    what: US stocks on announcement days, release day plus 4 trading days
    data: FRED SP500 daily closes (moves kept in the events files, as for the release day)
    score: >-
      mean over events of the mean over days of |simulated - real| daily percent moves, in units of 0.92 (one
      typical daily move): day 0 = published estimates plus people's trading, days 1-4 = people's trading only.
      The days are the release date and the next 4 FRED observation dates after it; the simulated move on each is
      the people's part compounded over the calendar days since the previous FRED date (weekends and US holidays
      carry over). A window ends before the next scored event's release date (cut windows reported). Also the
      day-0 score alone.
      Bootstrap 95% interval (2,000 resamples of events, seed 0) of the difference with and without people.
    pass: >-
      on the fit events, with people's trading the 5-day score and the day-0 score are each no worse than with
      people's trading off (estimates only); "no change" (every move 0) is reported alongside
    tune: kappa (rule_v2 in data/global/investors.yaml)
  B2:
    what: size of a multi-week move
    data: >-
      FRED SP500 daily closes from 2026-02-27 (the last close before the US and Israeli strikes on Iran) to 20
      trading days after 2026-03-02
    score: >-
      in examples/scenarios/iran_us_tension.yaml (10,000 people, USA and IRN, m1 settings, kappa as fitted,
      saving off): the largest one-day fall of the people's part, and the largest fall of the US index within
      any 20 trading days of the first 60 days
    pass: >-
      the largest one-day fall is no larger than the real S&P 500's largest one-day fall in that period; the
      largest 20-day fall is no larger than the real S&P 500's largest fall within 20 trading days in that period
    tune: none (a bound on kappa, applied by rule_v2)
  B3:
    what: a quiet year
    data: none (structural)
    score: 365 days with no news at 3,000 and 10,000 people (USA, DEU, IRN), seeds 1, 2, 3
    pass: >-
      the news part of every market is exactly 0 every day; the saving part has no trend (its mean daily step,
      pooled over seeds, lies within 2 standard errors of 0); every country's mood stays within 0.05 of its
      level on day 30. The saving part's yearly wander (standard deviation of the end level) at both sizes is
      reported
    tune: none (a failure is a bug)
  B4:
    what: who invests and how often they look
    data: data/global/investors_by_country.yaml (sourced ownership), investors.sicherman2016 (logins)
    score: simulated adult ownership share per country (10,000 people, all eight countries); simulated login percentiles
    pass: >-
      each country's simulated share of adults owning stock is within 5 points of its source (USA: the SCF
      bands' 57.7% and Gallup's 62% reported); the median and mean days logged in are within 10% of 36 and 85.2
    tune: none (a miss is fixed in the draw, never by tuning)
  B5:
    what: event odds over quiet stretches
    data: >-
      Polymarket daily prices (CLOB prices-history, interval max, fidelity 1440; recorded under
      runs/_benchmark/recordings, git-ignored) of binary markets found by the
      Gamma API search for each of: Iran, Israel, Russia Ukraine ceasefire, China Taiwan, recession, government
      shutdown, Fed (closed and open markets with an end date from 2025-01-01 to 2026-12-31), whose wording rule
      gives by_date or holds_through, with at least 30 daily prices. Fetched at the run and recorded locally
      (git-ignored); only market slugs and scores are committed (check Polymarket's terms of use)
    score: >-
      for each question, a small world (3,000 people, USA and the question's countries, no public figures,
      dated the first price's day) seeded at the first price, with no news, run for up to 60 days, stopping the
      day before the price first passes 0.97 or 0.03 or the market's end date; mean absolute difference in
      probability points between the simulated odds and the real price. Markets whose first price is already
      outside 0.03-0.97 are skipped. Baseline: the price stays where it started. Questions counted, bootstrap
      interval (2,000 resamples of questions, seed 0)
    pass: on the fit questions, time passing is no worse than the baseline, overall and for each kind
    tune: none (time passing has no free number); traders talking is reported with and without, never tuned
  B6:
    what: mood and unemployment (exploratory)
    data: FRED UNRATE and UMCSENT, monthly, 1978-2025 (only the fitted coefficient is kept)
    score: >-
      real: the change in sentiment per 1-point rise in unemployment over 12 months (OLS of 12-month changes), as
      a share of the index's 1978-2025 range; simulated: a layoffs what-if raising US unemployment by about 1
      point, no news, the change in US mood per point, as a share of the mood scale's width (2)
    pass: reported only; a gap above 3 times is flagged to the user (real sentiment also moves with news)
    tune: none
  B7:
    what: markets outside the US
    pass: 'stated: "No benchmark exists outside the US; every non-US size is an untested illustration using borrowed kappa and multiplier."'
  B8:
    what: trading volume
    pass: stated as not modelled (Jahan models each holder's whole stock position, not stock picking)
  B9:
    what: US stocks on unscheduled news days (no Fed decision or jobs report)
    selection: >-
      Chosen by the news, never by the market's move. Source: the English Wikipedia article "<year> in the United
      States", section Events (2023 to 2026; the page revision used is recorded). For each calendar month, the
      first two listed events in date order that (a) concern federal economic, fiscal, trade, tax or regulatory
      policy (including debt limits and shutdowns); elections, a change of control of government or a ruling of
      the Supreme Court; war, military strikes, attacks or sanctions involving the United States or a major oil
      producer; the failure, rescue or crisis of a financial institution; or a technology or energy development
      covered as national news; and (b) are not a scheduled Federal Reserve decision or monthly jobs report (B1
      covers those); and (c) are not natural disasters, crimes, sports, entertainment or deaths of people who held
      no office. A month with fewer than two such events keeps what it has (counts recorded). The trading day is
      the first US trading day on which the news could be traded: the event date if it is a trading day and the
      news was public before 16:00 New York time (or the time is unknown, recorded), otherwise the next trading
      day; two chosen events on one trading day are scored as one day with both headlines.
      Outcome-chosen days, scored but never used to choose anything: the seven not_modelled events of
      data/backtests/events_2026.yaml, 2026-10-30, 2026-11-04 and 2026-11-05.
    data: >-
      Each day's headlines as known before the move: one neutral factual sentence per event from the chronology
      entry and one contemporaneous report (never a sentence about market moves), with sources; FRED SP500 and
      NASDAQ100 percent moves on the trading day and the next 4 FRED observation dates (moves only; NASDAQ100 is
      used only to score the tech line). A coverage report lists every 2023-2025 day with an S&P 500 move of 2% or
      more that is not a Fed or jobs day, and whether it is among the chosen days (reported, never fitted)
    rating: >-
      Each day's headlines typed as one prompt into the What-if parser (jahan inject --preview path, model
      claude-sonnet-5-5, prompt hash recorded), recorded under runs/_benchmark/recordings and replayable; every
      day rated twice (test-retest agreement of market_valence reported); the first rating is the one scored
    score: >-
      for each day, a world dated the day before (m1 config, 10,000 people, USA and DEU, everyday activity
      version 2, saving off, ordinary-day movement off, no public figures acting), the parsed events injected,
      run one day: |simulated - real| S&P 500 percent move on the trading day in units of 0.92; mean over days.
      Also: direction right on days whose real move is 2% or more; the share of those days whose simulated move is
      within a factor of 2 of the real one; the same for the tech line against NASDAQ100; the real moves on the next
      4 days compared with the simulated (reversal check, reported); against "no change" and against the engine
      without other investors (s = 0); bootstrap 95% intervals (2,000 resamples of days, seed 0)
    pass: >-
      on the fit days, the day-0 score with other investors is no worse than with s = 0; on the hold-out days
      (once 20 exist) the same comparison is published, with direction and factor-of-2 shares on days of 2% or more
    tune: s (other_investors.rule_v4 in data/global/investors.yaml)
  B10:
    what: ordinary-day movement (other_investors.quiet_days)
    data: >-
      FRED SP500 and DEXUSEU and Yahoo Finance GC=F (gold futures) daily closes, 2023-01-01 to 2025-12-31,
      excluding Fed decision and jobs report days (only fitted coefficients are kept)
    score: >-
      a world with no news (3,000 people, USA and DEU, seeds 1, 2, 3, 365 days): the mean absolute daily move,
      its 95th percentile and the median absolute 21-trading-day move of US stocks, gold and the euro rate,
      against the same statistics of the real days
    pass: reported; each simulated statistic within 20% of the real one, otherwise flagged
    tune: none (the coefficients are fitted to the real days, never to this check)
  B11:
    what: does a different way of rating the news beat the current one on days after the rater's training data
    fresh_days: >-
      Selected by B9's rule, clauses (a) to (c), from the same page revision (2026 in the United States, oldid
      1384428393): every qualifying event dated 2026-07-01 to 2026-11-06 that is not among the events B9 chose (the
      third and later of each month), collected and written as neutral headlines before any move is looked at. A
      trading day already in data/backtests/news_days.yaml is dropped, because its move has been seen. Stored in
      data/backtests/news_days_extra.yaml. S&P 500 moves from Yahoo Finance ^GSPC closes, which matched FRED SP500
      within 0.0001 points on all 90 B9 days.
    clean_days: the B9 hold-out days plus the fresh days
    variants:
      A_current: the What-if parser as it is (the recorded first ratings of B9)
      B_material: >-
        A, plus these rating notes: "How to rate market_valence here: it measures how much the news changes what
        the whole US stock market is worth: the profits of companies overall, interest rates, or the availability
        of credit, compared with what investors already expected. Most news does not change these; leave
        market_valence at 0 unless the story clearly does. Bad news for people is not by itself bad news for
        shares: wars, attacks, political fights and elections are 0 unless they change oil supply, trade rules,
        taxes, interest rates or credit. Reserve 0.7 to 1, up or down, for events that change profits or rates
        across the whole economy, and use that range when they do. A story about only one part of the market is
        rated for that part (sectors)."
      C_context: >-
        A, plus: "What investors already knew before this day (headlines of the previous 30 days, oldest first):"
        with the dated headlines of every day in news_days.yaml and news_days_extra.yaml in the 30 calendar days
        before the trading day (or "none on file"), then: "Rate today's news only for what it changes against
        that: a further step in a story already under way counts only for the part investors had not expected."
      D_context_market: >-
        C, plus: "The S&P 500 before this day: previous day X%, last 5 trading days Y%, last 20 trading days Z%, N%
        below its one-year high." (from closes before the trading day only)
      E_material_context: B and C together
      P_placebo: >-
        the chosen variant if it uses context, with the context replaced by the headlines of the same 30-day
        window one year earlier. Scored on the clean days, reported, never chosen
    how_rated: >-
      Claude Sonnet 5.5 through the What-if parser, the extra text added to the world facts (no other change),
      recorded under runs/_benchmark/recordings and replayable; temperature and effort as in B9; one rating per day
    choosing_one: >-
      Using only the fit and seen days (2023-01-01 to 2026-06-30), never a clean day: leave-one-period-out over the
      periods 2023, 2024, 2025 and the first half of 2026. For each left-out period, s is fitted on the other
      periods (B9's loss and grid, the saved people's part of A held fixed in this step) and the left-out days are
      scored. The variant with the lowest mean score is chosen if it is at least 0.01 below A; otherwise A stays
      and only the other-investors default below is decided
    final_score: >-
      For the chosen variant only: s refitted on the 64 fit days with B9's full per-day worlds (B9's config). On
      the clean days: |simulated - real| in units of 0.92 for (a) the current engine, A with s = 1.43; (b) A with
      s = 0; (c) the chosen variant with its s; and no change. Also direction on rated days, the mean of simulated
      minus real, bootstrap 95% intervals of the differences (2,000 resamples of days, seed 0), and the same on the
      fresh days alone. The 7 outcome-chosen days and 30 October to 6 November are shown, never used to choose
    decision: >-
      Binding once at least 20 clean days exist. The default becomes (c) if (c) scores below (b) and below no change
      on the clean days and is not above (b) on the fresh days alone; otherwise, if (b) scores below (a), the
      other-investors' news reaction defaults to s = 0 (ordinary-day movement stays, and users can turn the reaction
      back on); (a) stays only if it scores below (b). The outcome is published whatever it shows. Fewer than 20
      clean days: reported as provisional and nothing changes
    tune: s only (as in B9); none of the variants' texts may change after the first call

if_nothing_passes: >-
  decided before any run: if no kappa passes B1 and B2, kappa is 0 (people's news reactions off; saving and
  cash-outs stay); if time passing fails B5, new questions get no time effect by default; if no positive s beats
  s = 0 on the B9 fit days, s is 0 (other investors' news reactions off; ordinary-day movement stays). The user is
  told, with the numbers, and can turn any of them back on.
