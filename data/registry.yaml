# Data registry: the provenance contract for every distribution the generator uses.
#
# confidence levels:
#   high         value taken from the cited source file; url pinned
#   medium       value from the cited source with documented harmonisation
#   low          heuristic or weakly sourced; acceptable but flagged in reports
#   provisional  approximate value entered by hand from general knowledge, to be
#                replaced by a download from the cited source (url may be a landing page)
#   placeholder  arbitrary value so the pipeline runs; must be replaced
#
# `jahan validate-data --strict` fails while any provisional or placeholder entry is referenced.

