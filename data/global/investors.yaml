          the user asked to fix the root rather than switch the reactions off.
      - mechanism: people traded on the day's change in their economic mood (a slow moving average of the news)
        date: '2026-10-15'
        kappa: 0.581
        fit_mean_miss_sd: {estimates_only: 1.0745, people_only: 1.0275, hybrid: 1.0178, no_change: 1.063}
        holdout_mean_miss_sd: {estimates_only: 1.0282, people_only: 1.1487, hybrid: 1.1104, no_change: 1.0666}
