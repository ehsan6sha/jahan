        reason: >-
          Replaced the same day. The fit sees release days, when mood has moved only a tenth of the way to where
          the news points (mood moves 10% of the gap a day), so it chose a kappa that made multi-day moves far
          too large: the Iran example fell 47% over four weeks, while real 2026 US-Iran escalation days moved the
          S&P 500 by less than 1%. People now trade on the news they learn that day instead. The 2026 hold-out
          result above had been seen before this change; the change was prompted by the scenario sizes.

other_investors:
  # Worlds with everyday activity version 2 (sim/economy.py). The simulated households are the only investors
  # simulated one by one; funds, pension funds, insurers and foreign investors, who hold most US stock, appear as
  # one labelled part: "other investors (not simulated one by one)".
  rule_v4: >-
    Registered 2026-11-08, before any B9 data was collected and before any run of this mechanism (scores:
    data/backtests/benchmarks.yaml B9). A news story with an explicit market_valence (mv, -1..1: how it bears on
    company profits and share prices compared with what investors expected before it, rated by the What-if parser
    or the headline classifier) moves the US stock index on the first US trading day at or after its release (a
    release at or after 21:00 UTC counts as the next day), once per story cluster (stories from one prompt sharing
    a story key; the member with the largest absolute impact counts), and permanently (never given back).
    impact = s x mv x salience on the part the story is about: a broad story moves the S&P 500 by impact and the
    tech line by the derived beta (1.299) x impact; a tech story moves the tech line by impact and the S&P 500 by
    w_it x impact, where w_it is information technology's weight in the S&P 500 (S&P Dow Jones Indices). No
    reaction to announcement headlines (published estimates already are the whole market's reaction), to Jahan's
    own market headlines, or to stories without an explicit market_valence. s minimises the B9 day-0 score over
    the fit days with kappa held at trading.kappa.fitted_v3 (0.048); the people's part comes from one simulation
    per day in shadow mode, seed offsets 0, 1 and 2 averaged (the other-investors part is computed exactly from
    the ratings); grid 0 to 20, step 0.01; ties and the grid edges resolve to the smallest s; a boundary optimum is
    reported and adopted. Constraints: B1 (day-0 and five-day scores no worse than without), stability (a
    scripted -3% day, as in rule_v2) and B2's bounds, with the Iran example's news events rated by the parser for
    market_valence and sector before the run (recorded; their hand-set salience kept). If the optimum breaks a
    constraint, the largest grid s below it that meets all of them is used and the substitution reported. If no
    positive s beats s = 0 on the fit days, s is 0. The bootstrap 95% interval of s (2,000 resamples of fit days,
    seed 0) and the loss at grid points are published. Seen and hold-out days as in benchmarks.yaml split.news.
  quiet_days: >-
    Registered 2026-11-08, before the fit. Worlds with everyday activity version 2 get daily movement on days
    without news from the same other investors (and news Jahan does not simulate): US stocks on US trading days,
    gold and the euro's dollar rate on weekdays. Fitted once by scripts/quiet_days_fit.py to real days
    2023-01-01..2025-12-31 without a Fed decision or jobs report (FRED SP500, FRED DEXUSEU, Yahoo Finance GC=F):
    a GARCH(1,1) variance for the S&P 500 with Student-t shocks (maximum likelihood), demeaned (no drift); gold and
    the euro rate move by their own standard deviation times the same variance ratio and their own shocks,
    correlated with the S&P 500's as in the data (one Student-t scale shared, so tails come together); the tech
    line by the derived beta. Only the coefficients are stored. Off in every benchmark and backtest. Checked by
    B10 (reported).
  # s was 1.43 (fitted_v4 below). Set to 0 on 2026-11-08 by the decision registered in benchmarks.yaml check B11: on
  # the 57 days after the rating model's training data it did worse than s = 0 (b11_result below). Users can turn the
  # reaction back on with `market_others_s: <value>` in a run config's params.
  s: 0.0
  b11_result:
    date: '2026-11-08'
    registered_in: 4dd1b14
    data_commit: 8c2d416
    command: uv run python -X utf8 scripts/rater_variants.py clean --rate
    clean_days: 57  # 8 B9 hold-out days and 49 fresh days, chosen by the news, none looked at before this run
    release_day_miss_in_units_of_0_92:
      current_rater_s_1_43: 0.710
      people_only_s_0: 0.586
      no_change: 0.603
      material_rater_s_3_67: 0.766
    fresh_days_only: {current_rater_s_1_43: 0.655, people_only_s_0: 0.558, no_change: 0.571, material_rater_s_3_67: 0.722}
    s_1_43_minus_s_0_ci95: [0.048, 0.202]  # positive: s = 1.43 is worse
    s_0_minus_no_change_ci95: [-0.071, 0.033]  # includes zero: the people's part is not distinguishable from no change
    chosen_on_earlier_days: B_material  # leave-one-period-out on 2023 to June 2026: 0.744 against 0.762 for the current rater
    direction_on_rated_clean_days: {current_rater: 26 of 50, material_rater: 19 of 32}
    verdict: other investors' news reaction defaults to s = 0 (rule in benchmarks.yaml B11); the rater is unchanged
  it_weight:  # information technology's weight in the S&P 500 (moves the S&P 500 on tech stories)
    value: 0.379
    as_of: '2026-08-31'
    source: markets.sp500_it_weight_2026
    range: [0.361, 0.397]  # other 2026 reports, by date and method
    note: >-
