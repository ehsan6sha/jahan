        seen_2026_scores: {events: 8, five_day: 0.8693, five_day_without_people: 0.8693, five_day_no_change: 0.8769}
        loss_at: {'0': 0.8405, '0.01': 0.8411, '0.05': 0.8486, '0.1': 0.8695, '0.2': 0.9257, '0.5': 1.1838}
        reason: >-
          Every positive kappa made the five-day score worse, so the registered outcome was kappa 0 (people's news
          reactions off). Diagnosis on the same events: 87% of the people's part fell on the four days after the
          release (late account checks, and news reaching most people a day or more later, Friday news landing on
