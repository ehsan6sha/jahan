<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jahan</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-toggle" id="menu-toggle" aria-label="Show sections" aria-expanded="false">&#9776;</button>
    <div class="brand"><span class="brand-mark" aria-hidden="true">&#9673;</span> Jahan</div>
    <label class="world-pick">
      <span class="sr-only">World</span>
      <select id="world-select" aria-label="Choose a world"></select>
    </label>
    <div class="chips" id="chips"></div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <section class="console" id="console" aria-live="polite">
    <div class="console-bar">
      <button class="console-toggle" id="console-toggle" aria-expanded="false">Command output</button>
      <code class="console-cmd" id="console-cmd"></code>
      <span class="console-state" id="console-state"></span>
      <button class="btn small danger" id="console-cancel" hidden>Cancel</button>
    </div>
    <pre class="console-out" id="console-out"></pre>
  </section>
  <script src="/app.js"></script>
</body>
</html>
